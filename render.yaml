# Render Blueprint for RemiPhoton (long-running Spectrum app).
# Uses a Web service so PORT is set; `src/index.ts` binds a minimal HTTP listener for health checks.
# Alternatively you can use a Background Worker (`type: worker`) if you prefer no HTTP at all.
services:
  - type: web
    name: remiphoton
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
